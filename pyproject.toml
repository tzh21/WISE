[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wise"
version = "0.1.0"
description = "WISE: World Knowledge-Informed Semantic Evaluation for text-to-image generation (WISE_Verified + legacy GPT-4o judge scripts)."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["text-to-image", "evaluation", "benchmark", "world-knowledge"]
dependencies = [
    "diffusers>=0.37.1",
    "requests>=2.28.0",
    # Bounded for PyTorch cu124 wheels (currently up to 2.6.x on download.pytorch.org).
    "torch>=2.5.0,<2.7",
    "tqdm>=4.66.0",
    "transformers>=5.7.0",
]

[project.optional-dependencies]
# Original GPT-4o-based judge in WISE_legacy/ uses the deprecated `openai` 0.x API.
legacy = ["openai>=0.28.1,<1"]

[project.urls]
Paper = "https://arxiv.org/abs/2503.07265"

# PyTorch: CUDA 12.4 wheels (Linux/Windows). macOS uses CPU wheels from the PyTorch index.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[tool.setuptools]
# Avoid auto-discovery of `WISE_legacy` and `data_verified` as installable packages.
py-modules = ["main", "calculate_verified", "vllm_eval"]
